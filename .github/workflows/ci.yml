name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: shellcheck infra/scripts/bootstrap infra/scripts/install infra/scripts/finalize-domain infra/scripts/outpostctl infra/scripts/deploy-remote infra/renewal-hooks/deploy/outpost
      - run: bun run check
      - name: Validate generated subscriptions with native engines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/install-native-tools.ts
          bun run check:subscriptions-native
      - name: Verify XHTTP, gRPC and UDP fallback through one TLS edge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          bun run check:transports-integration
      - run: bun run build:server
      - run: bun run build:cli:linux

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/outpost-agent ./cmd/outpost-agent

  cli-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run build:cli:mac
