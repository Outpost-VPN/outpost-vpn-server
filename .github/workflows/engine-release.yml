name: Signed AmneziaWG engine release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Official AmneziaWG stable version (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: engine-amneziawg-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ENGINE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - run: |
          bun install --frozen-lockfile
          bun scripts/release-engine.ts "$ENGINE_VERSION"
          .cache/engine-release/runtime/amneziawg-go --version
          .cache/engine-release/runtime/awg --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-engine
          path: release/outpost-engine-*.tar.gz
          if-no-files-found: error
          retention-days: 1
  sign-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-engine
          path: release
      - name: Sign and publish engine only
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          [[ "$ENGINE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/engine-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          archive="release/outpost-engine-amneziawg-${ENGINE_VERSION}-linux-amd64.tar.gz"
          minisign -S -W -s "$key" -m "$archive" -t "AmneziaWG $ENGINE_VERSION linux-amd64"
          minisign -Vm "$archive" -p infra/release/minisign.pub
          gh release create "engine-amneziawg-v${ENGINE_VERSION}" "$archive" "${archive}.minisig" \
            --target "$GITHUB_SHA" --title "AmneziaWG $ENGINE_VERSION" \
            --notes "Standalone signed engine runtime. No Outpost panel update required. Source archives and provenance are included."
