title = "Outpost secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Generated release output is ignored and scanned from its source files instead"
paths = ['''^release/''']

[[allowlists]]
description = "Pinned public SHA-256 of the official Xray release archive"
regexTarget = "secret"
regexes = ['''^8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40$''']

[[allowlists]]
description = "Golden SHA-256 fingerprints of deterministic subscription fixtures"
regexTarget = "secret"
regexes = [
  '''^4acd88ef98861fed276fc4716ab1f1cbd3cba56134e6a4acf4c4a59619a69b16$''',
  '''^ffc86874cf27c00cb9c47f4aee7fd52b6debcce8a457000cd49f787d024928a8$''',
]
