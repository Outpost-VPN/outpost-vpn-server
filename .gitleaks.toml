title = "Matreshka secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Generated release output is ignored and scanned from its source files instead"
paths = ['''^release/''']

[[allowlists]]
description = "Pinned public SHA-256 of the official Xray release archive"
regexTarget = "secret"
regexes = ['''^23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae$''']
